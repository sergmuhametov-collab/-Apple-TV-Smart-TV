name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Используем официальный и самый стабильный способ настройки Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install SDK Platform and Build Tools
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Unpack the project
        run: |
          ZIP=$(ls -S *.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::ZIP file not found in repository root!"
            exit 1
          fi
          echo "Using $ZIP"
          python3 - "$ZIP" <<'PY'
          import os, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          for info in z.infolist():
              name = info.filename.replace("\\", "/")
              target = os.path.join("work", name)
              if name.endswith("/"):
                  os.makedirs(target, exist_ok=True)
                  continue
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with z.open(info) as src, open(target, "wb") as dst:
                  dst.write(src.read())
          PY
          LAUNCHER=$(dirname "$(find work -name gradlew -type f | head -1)")
          echo "LAUNCHER=$LAUNCHER" >> "$GITHUB_ENV"
          echo "Project folder: $LAUNCHER"

      - name: Apply the latest launcher changes
        run: |
          for s in daynight_switch daynight_first inputs_bar apple_bar; do
            echo "=== $s"
            python3 scripts/$s.py "$LAUNCHER" || echo "::warning::$s was not applied"
          done

      - name: Build with Gradle
        run: |
          cd "$LAUNCHER"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: work/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

